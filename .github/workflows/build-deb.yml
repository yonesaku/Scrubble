name: Build Scrubble deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg

      - name: Install Theos
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Check SDKs
        run: ls "$THEOS/sdks"

      - name: Copy MediaRemote header if the repo has one
        run: |
          mkdir -p "$THEOS/vendor/include"
          if [ -f include/MediaRemote.h ]; then
            cp include/MediaRemote.h "$THEOS/vendor/include/"
          else
            echo "No MediaRemote.h in repo include folder, continuing anyway"
          fi

      - name: Build rootful deb
        run: make clean package FINALPACKAGE=1 TARGET=iphone:clang:latest:14.0

      - name: Build rootless deb
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:14.0

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: scrubble-debs
          path: packages/*.deb
